<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Menentukan karakter encoding agar browser bisa membaca simbol (seperti Rp, spasi) dengan benar -->
  <meta charset="UTF-8">
  
  <!-- Pengaturan viewport agar tampilan web responsif dan menyesuaikan ukuran layar HP atau Laptop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Judul web yang akan muncul di tab atas browser -->
  <title>Smart Order - Kopi Senja</title>
  
  <!-- File manifest.json diperlukan agar web bisa di-install (Add to Home Screen) layaknya aplikasi asli di HP -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Memberi warna pada tema browser HP saat web ini dibuka (warna cokelat gelap) -->
  <meta name="theme-color" content="#4A2E2B">
  
  <!-- Mengambil library FontAwesome untuk menampilkan icon (seperti icon keranjang, kursi meja, dll) secara gratis -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Menghubungkan file HTML ini dengan file styling (style.css) yang sudah kita buat sebelumnya -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================================================== -->
  <!-- PEMBUNGKUS UTAMA (APP-LAYOUT)                              -->
  <!-- Class ini berfungsi membagi layar jadi 2 kolom saat dibuka -->
  <!-- di layar lebar (Laptop). Kiri: Menu, Kanan: Keranjang.     -->
  <!-- Di HP, kolom kanan otomatis diubah CSS menjadi pop-up.     -->
  <!-- ========================================================== -->
  <div class="app-layout">
    
    <!-- ========================================================== -->
    <!-- BAGIAN KIRI: KONTEN UTAMA (HEADER & DAFTAR MENU)           -->
    <!-- ========================================================== -->
    <div class="main-content">
      
      <!-- HEADER: Menampilkan Logo/Nama Kafe dan Input Nomor Meja -->
      <header class="app-header">
        <div class="brand-info">
          <!-- Icon cangkir kopi -->
          <i class="fa-solid fa-mug-hot brand-icon"></i>
          <div>
            <h1 class="brand-title">Kopi Senja</h1>
            <p class="brand-subtitle">Smart Ordering System</p>
          </div>
        </div>
        
        <!-- DROPDOWN MEJA: Menggunakan tag <select> agar pengguna tinggal memilih angka 1-10 -->
        <div class="table-badge">
          <i class="fa-solid fa-chair"></i>
          <select id="tableSelect" class="table-select">
            <!-- Pilihan kosong sebagai default awal -->
            <option value="" disabled selected>Pilih Meja</option>
            <!-- Daftar pilihan meja dari 1 sampai 10 -->
            <option value="1">Meja 1</option>
            <option value="2">Meja 2</option>
            <option value="3">Meja 3</option>
            <option value="4">Meja 4</option>
            <option value="5">Meja 5</option>
            <option value="6">Meja 6</option>
            <option value="7">Meja 7</option>
            <option value="8">Meja 8</option>
            <option value="9">Meja 9</option>
            <option value="10">Meja 10</option>
          </select>
        </div>
      </header>

      <!-- NAVIGASI KATEGORI: Tombol filter (Semua, Minuman, Makanan) -->
      <!-- Atribut "data-category" nanti dibaca oleh app.js untuk disaring (filter) datanya -->
      <nav class="category-nav">
        <button class="category-btn active" data-category="semua">Semua</button>
        <button class="category-btn" data-category="minuman">Minuman</button>
        <button class="category-btn" data-category="makanan">Makanan</button>
      </nav>

      <!-- KONTEN MENU UTAMA -->
      <main class="container">
        
        <!-- KOTAK PENCARIAN (Search Bar) -->
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <!-- Input tempat user mengetik kata kunci. id="searchInput" akan di-tracking oleh JS -->
          <input type="text" id="searchInput" placeholder="Cari menu favoritmu...">
        </div>
        
        <!-- GRID MENU: Area kosong ini adalah "wadah". -->
        <!-- Nanti file app.js akan mengisi area ini dengan kartu-kartu menu secara otomatis dari menu.json -->
        <section class="menu-grid" id="menuGrid">
          <!-- Teks loading ini akan digantikan/dihilang setelah data menu berhasil dimuat -->
          <p class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</p>
        </section>

      </main>
    </div>

    <!-- ========================================================== -->
    <!-- BAGIAN KANAN: SIDEBAR KERANJANG & CHECKOUT                 -->
    <!-- Di HP menjadi Modal (muncul dari bawah), di Laptop netap.  -->
    <!-- ========================================================== -->
    
    <!-- BACKGROUND GELAP: Hanya muncul di HP saat modal keranjang terbuka, fungsi agar fokus ke keranjang -->
    <div class="modal-overlay hidden" id="cartOverlay"></div>
    
    <!-- PANEL KERANJANG -->
    <aside class="cart-sidebar" id="cartSidebar">
      
      <!-- Judul Keranjang & Tombol Tutup (Tombol tutup hanya relevan/muncul di layar HP) -->
      <div class="modal-header">
        <h2><i class="fa-solid fa-receipt"></i> Keranjang</h2>
        <button class="close-btn" id="closeCartModal"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Isi Keranjang & Formulir Pemesanan -->
      <div class="modal-body">
        
        <!-- AREA DAFTAR BARANG: Tempat app.js merender daftar barang yang ditambahkan ke keranjang -->
        <div class="cart-items-list" id="cartItemsList"></div>

        <!-- FORM CHECKOUT: Data pelanggan dan metode bayar -->
        <form id="checkoutForm" class="checkout-form">
          
          <!-- Input Nama -->
          <div class="form-group">
            <input type="text" id="customerName" placeholder="Nama Pemesan (Wajib)" required>
          </div>
          
          <!-- Input Catatan Khusus (Bisa dikosongkan) -->
          <div class="form-group">
            <textarea id="orderNotes" rows="2" placeholder="Catatan (opsional)..."></textarea>
          </div>
          
          <!-- Pilihan Metode Pembayaran (Menggunakan gaya kotak/kartu interaktif) -->
          <div class="form-group">
            <div class="payment-options">
              <!-- Label 1: Tunai -->
              <label class="payment-card">
                <!-- Tag input aslinya disembunyikan via CSS, yang diklik adalah area labelnya -->
                <input type="radio" name="paymentMethod" value="Tunai" checked>
                <span><i class="fa-solid fa-money-bill"></i> Tunai</span>
              </label>
              <!-- Label 2: QRIS -->
              <label class="payment-card">
                <input type="radio" name="paymentMethod" value="QRIS">
                <span><i class="fa-solid fa-qrcode"></i> QRIS</span>
              </label>
            </div>
          </div>

          <!-- Rangkuman Total Harga Belanjaan -->
          <div class="checkout-summary">
            <span>Total:</span>
            <!-- Tag <strong> ini teks harganya akan diperbarui otomatis oleh app.js -->
            <strong id="checkoutTotalText">Rp 0</strong>
          </div>
          
          <!-- TOMBOL SUBMIT: Saat ditekan, data di form ini diproses JS untuk dikirim via WA -->
          <button type="submit" class="btn-submit-order" id="btnSubmitOrder">
            <i class="fa-brands fa-whatsapp"></i> Pesan via WA
          </button>

        </form>
      </div>
    </aside>
  </div> <!-- Penutup .app-layout -->

  <!-- ========================================================== -->
  <!-- TOMBOL KERANJANG MELAYANG (FLOATING BUTTON KHUSUS HP)      -->
  <!-- Tombol ini muncul di area bawah layar HP jika ada barang di-->
  <!-- keranjang, sedangkan di layar Laptop akan disembunyikan.   -->
  <!-- ========================================================== -->
  <div class="floating-cart hidden" id="floatingCartBtn">
    <div class="cart-info">
      <!-- Icon keranjang dengan notifikasi jumlah barang -->
      <div class="cart-icon-wrapper">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="cart-badge" id="cartBadge">0</span> 
      </div>
      <!-- Pratinjau Harga Total Singkat -->
      <div class="cart-price-preview">
        <span class="label">Total</span>
        <span class="total-amount" id="cartTotalPreview">Rp 0</span>
      </div>
    </div>
    <!-- Tombol untuk membuka form keranjang -->
    <button class="btn-checkout-trigger" id="openCartBtn">Checkout <i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <!-- SCRIPT UTAMA: Menghubungkan logika pemrosesan yang ada di file app.js -->
  <!-- Pastikan baris script ini berada di bagian paling bawah sebelum tutup body, -->
  <!-- agar web memuat tampilannya (HTML) terlebih dahulu sebelum memuat logikanya. -->
  <script src="app.js"></script>

</body>
</html>
